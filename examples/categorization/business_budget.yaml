# Business Budget Categories Configuration
# =======================================
# Optimized for small business and freelancer expense tracking
# Focus on tax-deductible business expenses and revenue categories

version: '1.0'
default_category: Uncategorized
confidence_threshold: 0.80  # Higher threshold for business accuracy

