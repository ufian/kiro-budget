# AI Configuration for Business Use
# ================================
ai_config:
  enabled: true
  primary_service: openai
  fallback_service: claude
  cache_responses: true
  max_cost_per_month: 100.0  # Higher limit for business use
  rate_limit_per_minute: 30

# ML Configuration
# ===============
ml_config:
  enabled: true
  model_type: random_forest
  confidence_threshold: 0.70  # Higher threshold for business accuracy
  retrain_threshold: 100
  features:
    use_text_features: true
    use_amount_features: true
    use_temporal_features: true
    use_account_features: true