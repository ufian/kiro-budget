# AI Configuration
# ===============
ai_config:
  enabled: true
  primary_service: openai
  fallback_service: claude
  cache_responses: true
  max_cost_per_month: 50.0

# ML Configuration
# ===============
ml_config:
  enabled: true
  model_type: random_forest
  confidence_threshold: 0.6
  retrain_threshold: 100