# AI Configuration for Personal Use
# ================================
ai_config:
  enabled: true
  primary_service: openai
  fallback_service: claude
  cache_responses: true
  max_cost_per_month: 25.0  # Conservative limit for personal use
  rate_limit_per_minute: 15

# ML Configuration
# ===============
ml_config:
  enabled: true
  model_type: random_forest
  confidence_threshold: 0.65
  retrain_threshold: 50  # Retrain more frequently for personal use
  features:
    use_text_features: true
    use_amount_features: true
    use_temporal_features: true
    use_account_features: true