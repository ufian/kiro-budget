# AI Configuration for Family Use
# ==============================
ai_config:
  enabled: true
  primary_service: openai
  fallback_service: claude
  cache_responses: true
  max_cost_per_month: 40.0  # Moderate limit for family use
  rate_limit_per_minute: 20

# ML Configuration
# ===============
ml_config:
  enabled: true
  model_type: random_forest
  confidence_threshold: 0.65
  retrain_threshold: 75  # Retrain more frequently for family patterns
  features:
    use_text_features: true
    use_amount_features: true
    use_temporal_features: true
    use_account_features: true